# NeuroScope's backend is the only intended caller of this exact endpoint.
# Include this file inside the existing port-80 IIPImage `server` block, where
# the `local_iipsrv` upstream and `iip_local` FastCGI cache zone already exist.
location = /neuroscope-iip {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # FIF contains a private absolute filesystem path. Never write this
    # location's query string to the shared Nginx access log.
    access_log off;

    # GET also permits HEAD in nginx. Reject all state-changing methods.
    limit_except GET {
        deny all;
    }

    include /etc/nginx/fastcgi_params;
    fastcgi_pass local_iipsrv;
    fastcgi_keep_conn on;
    fastcgi_pass_request_headers off;
    fastcgi_param SCRIPT_FILENAME /var/www/html/fcgi-bin/iipsrv.fcgi;

    # `$query_string` is passed unchanged by fastcgi_params. This is important:
    # IIP requires FIF first and JTL last, and NeuroScope may repeat MINMAX.
    fastcgi_connect_timeout 2s;
    fastcgi_send_timeout 5s;
    fastcgi_read_timeout 20s;
    fastcgi_next_upstream error timeout invalid_header http_500 http_503;
    fastcgi_next_upstream_tries 2;
    fastcgi_next_upstream_timeout 25s;

    fastcgi_buffering on;
    fastcgi_buffer_size 64k;
    fastcgi_buffers 8 64k;
    fastcgi_busy_buffers_size 128k;

    # Reuse the cache zone already declared by the host's IIPImage site.
    # request_uri retains query order and repeated parameters in the cache key.
    fastcgi_cache iip_local;
    fastcgi_cache_key "neuroscope-iip:$request_uri";
    fastcgi_cache_methods GET HEAD;
    fastcgi_cache_valid 200 7d;
    fastcgi_cache_valid 404 1m;
    fastcgi_cache_use_stale error timeout updating http_500 http_503;
    fastcgi_cache_lock on;
    fastcgi_cache_lock_timeout 10s;
    fastcgi_cache_background_update on;

    fastcgi_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Content-Type-Options nosniff always;
}
