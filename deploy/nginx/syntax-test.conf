# Standalone wrapper used only by `nginx -t`. It does not replace or include
# the live nginx configuration and `nginx -t` does not bind this listen port.
pid /tmp/neuroscope-nginx-validation.pid;
error_log stderr notice;

events {
    worker_connections 32;
}

http {
    access_log off;

    fastcgi_cache_path /tmp/neuroscope-nginx-validation-cache
        levels=1:2
        keys_zone=iip_local:1m
        max_size=1m
        inactive=1m
        use_temp_path=off;

    upstream local_iipsrv {
        least_conn;
        server 127.0.0.1:9000;
        server 127.0.0.1:9004;
    }

    server {
        listen 127.0.0.1:18089;
        server_name localhost;

        include neuroscope-iip.location.conf;
    }
}
